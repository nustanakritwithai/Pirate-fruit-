# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint — backend only. The existing `pirate-fruit` Static Site is
# managed separately so this Blueprint never creates a suffixed duplicate.
services:
  - type: web
    name: pirate-fruit-server
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build:server
    startCommand: npm run db:migrate && npm run db:seed && npm run start:server
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - server/**
        - shared/**
        # The Server build bundles the canonical Living Economy kernel from these pure Client modules.
        - client/src/trade/living/**
        - client/src/island/IslandTypes.ts
        - client/src/persistence/GameStorage.ts
        - client/src/persistence/storageKeys.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        fromDatabase:
          name: pirate-fruit-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://pirate-fruit-u555.onrender.com
      - key: SERVER_VERSION
        value: 0.7.3
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_REMOTE_SESSION
        value: 'true'
      - key: ENABLE_ECONOMY_SERVER
        value: 'true'
      - key: ENABLE_REMOTE_SAVE
        value: 'true'
      # Production rollout: user has explicitly enabled the complete authority stack.
      # Code/schema defaults remain false for new environments; this Blueprint mirrors Production.
      - key: ENABLE_TRADE_SERVER
        value: 'true'
      - key: ENABLE_REALTIME
        value: 'true'
      - key: ENABLE_QUEST_SERVER
        value: 'true'
      - key: ENABLE_MONSTER_SERVER
        value: 'true'
      - key: ENABLE_PROGRESSION_SERVER
        value: 'true'
      - key: ENABLE_MULTIPLAYER
        value: 'true'
      - key: ENABLE_PVP
        value: 'true'
      - key: ENABLE_SHARED_WORLD_MONSTERS
        value: 'true'
      - key: ENABLE_BOAT_WORLD
        value: 'true'
      - key: ENABLE_CHARACTER_SELECT
        value: 'true'

databases:
  - name: pirate-fruit-db
    # Keep Blueprint aligned with the paid production database (PITR/recovery gate).
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: '16'
    databaseName: pirate_fruit
    user: pirate_fruit
    ipAllowList: []
