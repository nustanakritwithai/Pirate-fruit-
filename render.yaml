# Render Blueprint — Static Site สำหรับ Pirate Fruit (Vite + Three.js)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pirate-fruit
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: pirate-fruit-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - server/**
        - shared/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pirate-fruit-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: SERVER_VERSION
        value: 0.2.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_ECONOMY_SERVER
        value: false
      - key: ENABLE_REMOTE_SAVE
        value: false

databases:
  - name: pirate-fruit-db
    plan: free
    region: singapore
    databaseName: pirate_fruit
    user: pirate_fruit
    ipAllowList: []
