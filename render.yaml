# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint — backend only. The existing `pirate-fruit` Static Site is
# managed separately so this Blueprint never creates a suffixed duplicate.
services:
  - type: web
    name: pirate-fruit-server
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build:server
    startCommand: npm run db:migrate && npm run db:seed && npm run start:server
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - server/**
        - shared/**
        # The Server build bundles the canonical Living Economy kernel from these pure Client modules.
        - client/src/trade/living/**
        - client/src/island/IslandTypes.ts
        - client/src/persistence/GameStorage.ts
        - client/src/persistence/storageKeys.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        fromDatabase:
          name: pirate-fruit-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://pirate-fruit-u555.onrender.com
      - key: SERVER_VERSION
        value: 0.7.1
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_REMOTE_SESSION
        value: 'true'
      - key: ENABLE_ECONOMY_SERVER
        value: 'true'
      - key: ENABLE_REMOTE_SAVE
        value: 'true'
      # S8 Trade Authority — ปิดไว้จนกว่าจะผ่าน integration verification บน production
      # (ฝั่ง client ต้อง build ด้วย VITE_ENABLE_TRADE_SERVER=true พร้อมกันตอนเปิดใช้)
      - key: ENABLE_TRADE_SERVER
        value: 'false'
      # S9 WebSocket Foundation — ปิดจนกว่าจะ verify (client ต้อง build ด้วย VITE_ENABLE_REALTIME=true พร้อมกัน)
      - key: ENABLE_REALTIME
        value: 'false'
      # S10 Quest/Reward Authority — ปิดจนกว่าจะ verify (client ต้อง build ด้วย VITE_ENABLE_QUEST_SERVER=true พร้อมกัน)
      - key: ENABLE_QUEST_SERVER
        value: 'false'
      # S11 Monster Reward Authority — ปิดจนกว่าจะ verify (client ต้อง build ด้วย VITE_ENABLE_MONSTER_SERVER=true พร้อมกัน)
      - key: ENABLE_MONSTER_SERVER
        value: 'false'
      # S12 Progression Authority — level เดินจาก EXP ที่ Server แจก (ต้องเปิด QUEST+MONSTER ก่อน; client ต้อง build ด้วย VITE_ENABLE_PROGRESSION_SERVER=true พร้อมกัน)
      - key: ENABLE_PROGRESSION_SERVER
        value: 'false'
      # S13 Multiplayer Movement — presence relay บน WebSocket (ต้องเปิด ENABLE_REALTIME ก่อน; client ต้อง build ด้วย VITE_ENABLE_MULTIPLAYER=true พร้อมกัน)
      - key: ENABLE_MULTIPLAYER
        value: 'false'
      # S15 Multiplayer Combat Authority (PvP) — Server เป็นเจ้าของ HP/ดาเมจ (ต้องเปิด ENABLE_MULTIPLAYER ก่อน; client ต้อง build ด้วย VITE_ENABLE_PVP=true พร้อมกัน)
      - key: ENABLE_PVP
        value: 'false'
      # S16 Shared Monster World — Server จำลองมอนสเตอร์กลาง (ต้องเปิด ENABLE_MULTIPLAYER ก่อน; client ต้อง build ด้วย VITE_ENABLE_SHARED_WORLD_MONSTERS=true พร้อมกัน)
      - key: ENABLE_SHARED_WORLD_MONSTERS
        value: 'false'
      # S17 Authoritative Boat World — Server owns boat movement/HP/cannon/passengers.
      - key: ENABLE_BOAT_WORLD
        value: 'false'
      # S18 Character Select — หน้า login แขก + เลือก/สร้าง/ลบตัวละคร (ต้องเปิด ENABLE_REMOTE_SESSION; client ต้อง build ด้วย VITE_ENABLE_CHARACTER_SELECT=true พร้อมกัน)
      - key: ENABLE_CHARACTER_SELECT
        value: 'false'

databases:
  - name: pirate-fruit-db
    # Keep Blueprint aligned with the paid production database (PITR/recovery gate).
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: '16'
    databaseName: pirate_fruit
    user: pirate_fruit
    ipAllowList: []
