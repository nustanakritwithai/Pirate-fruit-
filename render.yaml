# Render Blueprint — Static Site สำหรับ Pirate Fruit (Vite + Three.js)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pirate-fruit
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build:shared && npm run build:client
    staticPublishPath: client/dist
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - client/**
        - shared/**
    envVars:
      - key: VITE_USE_REMOTE_SERVER
        value: false
      - key: VITE_ENABLE_REMOTE_SESSION
        value: false
      - key: VITE_ENABLE_ECONOMY_SERVER
        value: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: pirate-fruit-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: npm run db:migrate && npm run start:server
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - server/**
        - shared/**
        # The Server build bundles the canonical Living Economy kernel from these pure Client modules.
        - client/src/trade/living/**
        - client/src/island/IslandTypes.ts
        - client/src/persistence/GameStorage.ts
        - client/src/persistence/storageKeys.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pirate-fruit-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: SERVER_VERSION
        value: 0.7.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_REMOTE_SESSION
        value: false
      - key: ENABLE_ECONOMY_SERVER
        value: false
      - key: ENABLE_REMOTE_SAVE
        value: false

databases:
  - name: pirate-fruit-db
    plan: free
    region: singapore
    databaseName: pirate_fruit
    user: pirate_fruit
    ipAllowList: []
