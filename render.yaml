# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint — existing Static Site plus Server and PostgreSQL.
services:
  - type: web
    name: pirate-fruit
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:shared && npm run build:client
    staticPublishPath: client/dist
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - client/**
        - shared/**
    envVars:
      - key: VITE_API_URL
        value: https://pirate-fruit-server.onrender.com
      - key: VITE_USE_REMOTE_SERVER
        value: 'true'
      - key: VITE_ENABLE_REMOTE_SESSION
        value: 'true'
      - key: VITE_ENABLE_ECONOMY_SERVER
        value: 'true'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: pirate-fruit-server
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: npm run db:migrate && npm run db:seed && npm run start:server
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - server/**
        - shared/**
        # The Server build bundles the canonical Living Economy kernel from these pure Client modules.
        - client/src/trade/living/**
        - client/src/island/IslandTypes.ts
        - client/src/persistence/GameStorage.ts
        - client/src/persistence/storageKeys.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        fromDatabase:
          name: pirate-fruit-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://pirate-fruit-u555.onrender.com
      - key: SERVER_VERSION
        value: 0.7.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_REMOTE_SESSION
        value: 'true'
      - key: ENABLE_ECONOMY_SERVER
        value: 'true'
      - key: ENABLE_REMOTE_SAVE
        value: 'true'

databases:
  - name: pirate-fruit-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    databaseName: pirate_fruit
    user: pirate_fruit
    ipAllowList: []
