# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint — backend only. The existing Static Site remains
# https://pirate-fruit-u555.onrender.com and is intentionally not duplicated here.
services:
  - type: web
    name: pirate-fruit-server
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build:shared && npm run build:server
    startCommand: npm run db:migrate && npm run start:server
    initialDeployHook: npm run db:seed
    healthCheckPath: /health
    buildFilter:
      paths:
        - package.json
        - package-lock.json
        - tsconfig.base.json
        - server/**
        - shared/**
        # The Server build bundles the canonical Living Economy kernel from these pure Client modules.
        - client/src/trade/living/**
        - client/src/island/IslandTypes.ts
        - client/src/persistence/GameStorage.ts
        - client/src/persistence/storageKeys.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        fromDatabase:
          name: pirate-fruit-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://pirate-fruit-u555.onrender.com
      - key: SERVER_VERSION
        value: 0.7.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_REMOTE_SESSION
        value: 'false'
      - key: ENABLE_ECONOMY_SERVER
        value: 'false'
      - key: ENABLE_REMOTE_SAVE
        value: 'false'

databases:
  - name: pirate-fruit-db
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    databaseName: pirate_fruit
    user: pirate_fruit
    ipAllowList: []
