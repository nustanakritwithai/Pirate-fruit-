# Render Blueprint — Static Site สำหรับ Pirate Fruit (Vite + Three.js)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pirate-fruit
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
