name: Pirate owned monster renderer

on:
  pull_request:
    paths:
      - 'client/src/monster/PocketOwnedMonsterRenderer.ts'
      - 'client/src/monster/__tests__/pocketOwnedMonsterRenderer.test.ts'
      - 'client/src/monster/SharedMonsterClient.ts'
      - 'client/src/monster/__tests__/sharedMonsterClient.test.ts'
      - 'scripts/monster-combat-visual-proof.mjs'
      - 'client/tsconfig.owned-monster.json'
      - 'asset-presentation/**'
      - 'assets/catalog/monster-*.json'
      - 'client/src/main.ts'
      - '.github/workflows/pirate-owned-renderer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The nested Pocket client is hosted by the parent page. It must not
      # create its own login/session or enable unrelated remote write paths.
      VITE_USE_REMOTE_SERVER: 'false'
      VITE_ENABLE_REMOTE_SESSION: 'false'
      VITE_ENABLE_ECONOMY_SERVER: 'false'
      VITE_ENABLE_TRADE_SERVER: 'false'
      VITE_ENABLE_QUEST_SERVER: 'false'
      VITE_ENABLE_MONSTER_SERVER: 'false'
      VITE_ENABLE_PROGRESSION_SERVER: 'false'
      VITE_ENABLE_CHARACTER_SELECT: 'false'
      VITE_ENABLE_ONBOARDING: 'false'
      VITE_ENABLE_REALTIME: 'true'
      VITE_ENABLE_MULTIPLAYER: 'true'
      VITE_ENABLE_SHARED_WORLD_MONSTERS: 'true'
      VITE_ENABLE_PVP: 'false'
      VITE_ENABLE_BOAT_WORLD: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm test --workspace=pirate-fruit-client -- --run src/monster/__tests__/pocketOwnedMonsterRenderer.test.ts src/realtime/__tests__/pocketMonsterParentPresence.test.ts
      - run: npm test --workspace=pirate-fruit-client -- --run src/monster/__tests__/sharedMonsterClient.test.ts
      - name: Typecheck nested client
        working-directory: client
        run: npx tsc --noEmit
      - name: Build nested deployment artifact
        working-directory: client
        run: npx vite build --base=./
      - name: Verify procedural asset budget
        working-directory: client
        run: node scripts/verify-procedural-budget.mjs
      - name: ติดตั้งเบราว์เซอร์เฉพาะ runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: ตรวจภาพการโจมตีของมอนและศัตรูจริงใน Chromium
        run: |
          npm run dev --workspace=pirate-fruit-client > /tmp/combat-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node scripts/monster-combat-visual-proof.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: monster-combat-visual-proof
          path: combat-visual-proof/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: pirate-client-dist
          path: client/dist
          if-no-files-found: error
