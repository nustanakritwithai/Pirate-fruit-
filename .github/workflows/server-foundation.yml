name: Client and server gates

on:
  pull_request:
  push:
    branches:
      - claude/blox-fruits-three-js-roadmap-1f2f5u

concurrency:
  group: server-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pirate_fruit_test
          POSTGRES_USER: pirate_fruit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pirate_fruit -d pirate_fruit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://pirate_fruit@127.0.0.1:5432/pirate_fruit_test
      POCKETMONSTER_CLIENT_ROOT: ${{ github.workspace }}/.qa/pocketmonster-client
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout pinned Client parent bridge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: nustanakritwithai/PocketMonster
          ref: 767f025b3eff33bb23ac77640fbd0d322da36399
          path: .qa/pocketmonster-client
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:server
      - run: npm test
      - run: npm run test:extended

  # S8: บูตเกม build จริงในเบราว์เซอร์จริง ยิงข้าม origin ไป server จริง —
  # จับบั๊กคลาส CORS/cookie/preflight ที่ inject/Node fetch มองไม่เห็น
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pirate_fruit_smoke
          POSTGRES_USER: pirate_fruit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pirate_fruit -d pirate_fruit_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pirate_fruit@127.0.0.1:5432/pirate_fruit_smoke
      CLIENT_ORIGIN: http://127.0.0.1:4173
      ENABLE_REMOTE_SESSION: 'true'
      ENABLE_REMOTE_SAVE: 'true'
      ENABLE_ECONOMY_SERVER: 'true'
      ENABLE_TRADE_SERVER: 'true'
      ENABLE_REALTIME: 'true'
      ENABLE_QUEST_SERVER: 'true'
      ENABLE_MONSTER_SERVER: 'true'
      ENABLE_PROGRESSION_SERVER: 'true'
      ENABLE_MULTIPLAYER: 'true'
      ENABLE_PVP: 'true'
      ENABLE_SHARED_WORLD_MONSTERS: 'true'
      ENABLE_BOAT_WORLD: 'true'
      ENABLE_CHARACTER_SELECT: 'true'
      PORT: '10000'
      VITE_API_URL: http://127.0.0.1:10000
      VITE_USE_REMOTE_SERVER: 'true'
      VITE_ENABLE_REMOTE_SESSION: 'true'
      VITE_ENABLE_ECONOMY_SERVER: 'true'
      VITE_ENABLE_TRADE_SERVER: 'true'
      VITE_ENABLE_REALTIME: 'true'
      VITE_ENABLE_QUEST_SERVER: 'true'
      VITE_ENABLE_MONSTER_SERVER: 'true'
      VITE_ENABLE_PROGRESSION_SERVER: 'true'
      VITE_ENABLE_MULTIPLAYER: 'true'
      VITE_ENABLE_PVP: 'true'
      VITE_ENABLE_SHARED_WORLD_MONSTERS: 'true'
      VITE_ENABLE_BOAT_WORLD: 'true'
      VITE_ENABLE_CHARACTER_SELECT: 'true'
      SMOKE_EXPECT_REALTIME: 'true'
      SMOKE_EXPECT_QUEST: 'true'
      SMOKE_EXPECT_MONSTER: 'true'
      SMOKE_EXPECT_PROGRESSION: 'true'
      SMOKE_EXPECT_MULTIPLAYER: 'true'
      # S17 replaces S14 boatId presence in this slice; S14 fallback remains covered with the flag off in unit tests.
      SMOKE_EXPECT_NAVAL: 'false'
      SMOKE_EXPECT_PVP: 'true'
      SMOKE_EXPECT_WORLD_MONSTERS: 'true'
      SMOKE_EXPECT_BOAT_WORLD: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - name: Generate ephemeral browser smoke secret
        shell: bash
        run: echo "SESSION_SECRET=$(node -e \"process.stdout.write(require('crypto').randomBytes(32).toString('hex'))\")" >> "$GITHUB_ENV"
      - name: Start server and client preview
        run: |
          node server/dist/index.js &
          npx --workspace=pirate-fruit-client vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:10000/ready && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4173/ > /dev/null
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser-smoke-diagnostics
      - run: node scripts/browser-smoke.mjs

